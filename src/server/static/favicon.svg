<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="50%" stop-color="#0f223d"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>

    <!-- Subtle border glow -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Economic Opportunity Vector Gradient -->
    <linearGradient id="vector-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Emerald Alpha Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Facet Fill Gradient Left -->
    <linearGradient id="facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Facet Fill Gradient Right -->
    <linearGradient id="facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="url(#border-grad)" stroke-width="1.8" fill="none"/>

  <!-- Geometric Economic Intelligence Facets -->
  <polygon points="32,13 16,29 32,35" fill="url(#facet-left)"/>
  <polygon points="32,13 48,29 32,35" fill="url(#facet-right)"/>
  <polygon points="16,29 24,49 32,35" fill="url(#facet-left)" fill-opacity="0.7"/>
  <polygon points="48,29 40,49 32,35" fill="url(#facet-right)" fill-opacity="0.7"/>

  <!-- Network Vector Lattice (Graph Edges) -->
  <path d="M32 13 L16 29 L24 49 L32 35 L40 49 L48 29 Z" 
        stroke="url(#vector-grad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Axis & Upward Opportunity Beam -->
  <line x1="32" y1="35" x2="32" y2="13" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="29" x2="48" y2="29" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.7"/>
  <line x1="24" y1="49" x2="40" y2="49" stroke="#1e40af" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Opportunity Trajectory Chevron / Dynamic Arrow inside Nexus -->
  <path d="M26 38 L32 31 L38 38" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Network Intelligence Nodes (Data & Agent Nexus) -->
  <circle cx="16" cy="29" r="3.2" fill="#38bdf8" stroke="#0b1528" stroke-width="1.5"/>
  <circle cx="48" cy="29" r="3.2" fill="#60a5fa" stroke="#0b1528" stroke-width="1.5"/>
  <circle cx="24" cy="49" r="2.8" fill="#2563eb" stroke="#0b1528" stroke-width="1.5"/>
  <circle cx="40" cy="49" r="2.8" fill="#1d4ed8" stroke="#0b1528" stroke-width="1.5"/>
  <circle cx="32" cy="35" r="3.5" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Top Apex Opportunity Discovery Node (Emerald Beacon) -->
  <circle cx="32" cy="13" r="4.2" fill="url(#emerald-grad)" stroke="#ffffff" stroke-width="1.8" filter="url(#glow)"/>
</svg>